<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Imagen decorativa de evento">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff36a2"/>
      <stop offset="50%" stop-color="#9b36ff"/>
      <stop offset="100%" stop-color="#36d0ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff36a2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#36d0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" rx="48" fill="#08131e"/>
  <circle cx="300" cy="200" r="220" fill="url(#g)" opacity="0.18"/>
  <circle cx="900" cy="600" r="280" fill="url(#g)" opacity="0.15"/>
  <rect x="96" y="96" width="1008" height="608" rx="36" fill="#0f2234" stroke="rgba(255,255,255,0.14)"/>
  
  <!-- Soundwave / Equalizer graphic -->
  <g fill="url(#g)" opacity="0.85">
    <rect x="260" y="380" width="32" height="140" rx="16"/>
    <rect x="320" y="300" width="32" height="220" rx="16"/>
    <rect x="380" y="240" width="32" height="280" rx="16"/>
    <rect x="440" y="180" width="32" height="340" rx="16"/>
    <rect x="500" y="280" width="32" height="240" rx="16"/>
    <rect x="560" y="200" width="32" height="320" rx="16"/>
    <rect x="620" y="160" width="32" height="360" rx="16"/>
    <rect x="680" y="260" width="32" height="260" rx="16"/>
    <rect x="740" y="220" width="32" height="300" rx="16"/>
    <rect x="800" y="320" width="32" height="200" rx="16"/>
    <rect x="860" y="400" width="32" height="120" rx="16"/>
    <rect x="920" y="440" width="32" height="80" rx="16"/>
  </g>
  
  <!-- Event Stage Glow -->
  <path d="M 200 600 Q 600 480 1000 600 L 1000 640 L 200 640 Z" fill="url(#glow)"/>
</svg>
